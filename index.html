<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8553d">
<title>Mes recettes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --ink:#2b2622; --muted:#7a7068; --line:#e8e0d6;
  --accent:#c8553d; --accent-ink:#ffffff;
  --viande:#b5523b; --poisson:#2f6f8f; --veggie:#4f8a34; --fromage:#b8861c;
  --done:#b9b0a6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --surface:#28241f; --ink:#f1ebe3; --muted:#a89d92; --line:#3b352e;
    --accent:#e0735a; --done:#6b625a;
    --viande:#e07a62; --poisson:#5fa3c4; --veggie:#7fbf5f; --fromage:#e0b04a;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a17; --surface:#28241f; --ink:#f1ebe3; --muted:#a89d92; --line:#3b352e;
  --accent:#e0735a; --done:#6b625a;
  --viande:#e07a62; --poisson:#5fa3c4; --veggie:#7fbf5f; --fromage:#e0b04a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- Accueil ---------- */
#home{max-width:1400px;margin:0 auto;padding:20px 24px 40px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0;font-weight:700;letter-spacing:.2px}
.top h1 span{color:var(--accent)}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;font-size:19px;padding:12px 44px 12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent)}
.search .clear{position:absolute;right:6px;top:50%;margin-top:-18px;width:36px;height:36px;border:0;background:transparent;font-size:22px;color:var(--muted)}
.iconbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px;white-space:nowrap}
.iconbtn:active{transform:scale(.97)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-size:17px}
.chip .n{color:var(--muted);font-size:14px;margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:inherit;opacity:.7}
.count{color:var(--muted);font-size:15px;margin:6px 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:12px;padding:14px 16px;min-height:112px}
.card:active{transform:scale(.985)}
.card h3{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.2}
.card .meta{font-size:14px;color:var(--muted)}
.card .match{font-size:14px;margin-top:6px;color:var(--ink)}
.card .match b{background:rgba(200,85,61,.18);font-weight:600;border-radius:3px;padding:0 2px}
.c-Viande{border-left-color:var(--viande)} .c-Poisson{border-left-color:var(--poisson)}
.c-Veggie{border-left-color:var(--veggie)} .c-Fromage{border-left-color:var(--fromage)}
.t-Viande{color:var(--viande)} .t-Poisson{color:var(--poisson)} .t-Veggie{color:var(--veggie)} .t-Fromage{color:var(--fromage)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:18px}

/* ---------- Recette (tient sur un écran) ---------- */
#recipe{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#rbox{flex:1;display:flex;flex-direction:column;padding:.8em 1.2em .9em;min-height:0;font-size:20px}
.rbar{display:flex;align-items:center;gap:.6em;flex-wrap:nowrap}
.rbar .iconbtn{font-size:.8em;padding:.45em .8em}
.rbar .sp{flex:1}
.rhead{display:flex;align-items:flex-end;gap:1em;margin:.35em 0 .55em;border-bottom:2px solid var(--line);padding-bottom:.45em;flex-wrap:wrap}
.rhead h2{font-family:Georgia,"Times New Roman",serif;font-size:1.9em;line-height:1.1;margin:0;flex:1;min-width:8em}
.rinfo{display:flex;align-items:center;gap:.9em;font-size:.9em;color:var(--muted);white-space:nowrap}
.rinfo .cat{font-weight:700}
.stepper{display:flex;align-items:center;gap:.35em;color:var(--ink)}
.stepper button{width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1em;line-height:1;padding:0}
.stepper .pv{min-width:4.6em;text-align:center;font-weight:600}
.stepper .pv.changed{color:var(--accent)}
.rcols{flex:1;display:flex;gap:1.6em;min-height:0}
.rcol{min-height:0}
.rcol.ing{flex:0 0 40%}
.rcol.steps{flex:1}
.rcol h4{margin:0 0 .35em;font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
ul.ings{list-style:none;margin:0;padding:0}
ul.ings li{padding:.2em 0 .2em 1.3em;position:relative;line-height:1.25;border-bottom:1px dashed var(--line)}
ul.ings li:before{content:"";position:absolute;left:.1em;top:.48em;width:.6em;height:.6em;border:2px solid var(--muted);border-radius:3px}
ul.ings li .q{font-weight:700}
ul.ings li.ok{color:var(--done);text-decoration:line-through}
ul.ings li.ok:before{background:var(--done);border-color:var(--done)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:.25em 0 .45em 2.1em;line-height:1.35}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:.2em;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.95em;display:flex;align-items:center;justify-content:center}
ol.steps li.ok{color:var(--done)}
ol.steps li.ok:before{background:var(--done)}
.hint{font-size:.62em;color:var(--muted);margin-top:.5em}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:.92}

/* Mode cuisine : seul l'essentiel reste visible */
body.cuisine .rbar .hide-cuisine{display:none}
body.cuisine .hint{display:none}
body.cuisine #btnCuisine{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Portrait : colonnes empilées */
@media (orientation: portrait){
  .rcols{flex-direction:column;gap:.7em}
  .rcol.ing{flex:0 0 auto}
}
</style>
</head>
<body>

<div id="home">
  <div class="top">
    <h1>Mes <span>recettes</span></h1>
    <div class="search">
      <input id="q" type="text" placeholder="Chercher un plat ou un ingrédient (courgette, thon…)" autocomplete="off">
      <button class="clear hidden" id="qclear" aria-label="Effacer">×</button>
    </div>
    <button class="iconbtn" id="btnRandom" title="Une recette au hasard">Au hasard</button>
    <button class="iconbtn" id="btnFsHome" title="Plein écran">Plein écran</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="recipe" class="hidden">
  <div id="rbox">
    <div class="rbar">
      <button class="iconbtn hide-cuisine" id="btnBack">← Recettes</button>
      <div class="sp"></div>
      <button class="iconbtn hide-cuisine" id="btnFs">Plein écran</button>
      <button class="iconbtn" id="btnCuisine">Mode cuisine</button>
    </div>
    <div class="rhead">
      <h2 id="rtitle"></h2>
      <div class="rinfo">
        <span class="cat" id="rcat"></span>
        <span id="rtime"></span>
        <span class="stepper">
          <button id="pminus" aria-label="Moins de personnes">−</button>
          <span class="pv" id="pval"></span>
          <button id="pplus" aria-label="Plus de personnes">+</button>
        </span>
      </div>
    </div>
    <div class="rcols">
      <div class="rcol ing">
        <h4>Ingrédients</h4>
        <ul class="ings" id="ring"></ul>
      </div>
      <div class="rcol steps">
        <h4>Préparation</h4>
        <ol class="steps" id="rsteps"></ol>
        <div class="hint">Astuce : touchez un ingrédient ou une étape pour le cocher.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="recettes.js"></script>
<script>
/* Code volontairement en JavaScript « ancien » (ES5) pour fonctionner sur les vieilles tablettes. */
(function(){
  var R = window.RECETTES || [];
  var CATS = ['Viande','Poisson','Veggie','Fromage'];
  var state = { cat: null, q: '', cur: null, pers: 4 };
  var wakeLock = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function norm(s){
    s = String(s).toLowerCase();
    var map = {'à':'a','â':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','î':'i','ï':'i','ô':'o','ö':'o','ù':'u','û':'u','ü':'u','ç':'c','œ':'oe','æ':'ae','’':"'"};
    return s.replace(/[àâäéèêëîïôöùûüçœæ’]/g,function(c){return map[c];});
  }
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.className='toast on';
    clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast'; },2200);
  }

  /* ---------- Quantités ---------- */
  var FR = [[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾'],[1,'']];
  function frac(v){
    var w = Math.floor(v), r = v - w, best = FR[0], d = 9;
    for (var i=0;i<FR.length;i++){ var dd=Math.abs(r-FR[i][0]); if (dd<d){ d=dd; best=FR[i]; } }
    if (best[0]===1){ w+=1; best=FR[0]; }
    if (w===0 && best[1]==='') return '¼';
    return (w? String(w) : '') + best[1];
  }
  function fmtQ(q,u){
    if (u==='g' || u==='ml'){
      if (q>=1000 && u==='g') return (Math.round(q/50)*50/1000).toString().replace('.',',')+' kg';
      q = q>=100 ? Math.round(q/10)*10 : (q>=20 ? Math.round(q/5)*5 : Math.max(1,Math.round(q)));
      return q+' '+u;
    }
    if (u==='cl' || u==='l' || u==='kg'){
      q = q>=20 ? Math.round(q/5)*5 : Math.round(q*10)/10;
      return String(q).replace('.',',')+' '+u;
    }
    return frac(q);
  }
  function ingText(it, k){
    if (it.q===null || it.q===undefined) return esc(it.p);
    var v = it.q*k;
    var qs = fmtQ(v, it.u);
    var plural = it.u ? true : (parseFloat(v) >= 1.75);
    var txt = (!plural && it.s) ? it.s : it.p;
    return '<span class="q">'+esc(qs)+'</span> '+esc(txt);
  }

  /* ---------- Accueil ---------- */
  function renderChips(){
    var h = '<button class="chip'+(state.cat?'':' on')+'" data-c="">Toutes<span class="n">'+R.length+'</span></button>';
    for (var i=0;i<CATS.length;i++){
      var n=0; for (var j=0;j<R.length;j++) if (R[j].categorie===CATS[i]) n++;
      if (!n) continue;
      h += '<button class="chip'+(state.cat===CATS[i]?' on':'')+'" data-c="'+CATS[i]+'">'+CATS[i]+'<span class="n">'+n+'</span></button>';
    }
    $('chips').innerHTML = h;
  }
  function renderGrid(){
    var q = norm(state.q.replace(/^\s+|\s+$/g,'')), words = q ? q.split(/\s+/) : [];
    var out = [], h = '';
    for (var i=0;i<R.length;i++){
      var r = R[i];
      if (state.cat && r.categorie!==state.cat) continue;
      var hits = [];
      if (words.length){
        var ok = true;
        for (var w=0; w<words.length; w++){
          var found = norm(r.titre).indexOf(words[w])>=0;
          for (var k=0;k<r.ingredients.length;k++){
            var t = r.ingredients[k].p;
            if (norm(t).indexOf(words[w])>=0){ found=true; if (hits.indexOf(t)<0) hits.push(t); }
          }
          if (!found){ ok=false; break; }
        }
        if (!ok) continue;
      }
      out.push(r);
      h += '<button class="card c-'+r.categorie+'" data-id="'+r.id+'"><h3>'+esc(r.titre)+'</h3>'+
           '<div class="meta"><span class="t-'+r.categorie+'">'+r.categorie+'</span> · '+r.temps+' min · '+r.portions+' pers. · '+r.ingredients.length+' ingrédients</div>'+
           (hits.length ? '<div class="match">Contient : <b>'+hits.slice(0,3).map(esc).join('</b>, <b>')+'</b></div>' : '')+
           '</button>';
    }
    $('grid').innerHTML = h || '<div class="empty">Aucune recette ne correspond.</div>';
    $('count').textContent = out.length + (out.length>1?' recettes':' recette');
  }

  /* ---------- Recette ---------- */
  function byId(id){ for (var i=0;i<R.length;i++) if (R[i].id===id) return R[i]; return null; }
  function renderRecipe(){
    var r = state.cur; if (!r) return;
    var k = state.pers / r.portions;
    $('rtitle').textContent = r.titre;
    $('rcat').textContent = r.categorie; $('rcat').className = 'cat t-'+r.categorie;
    $('rtime').textContent = r.temps+' min';
    $('pval').textContent = state.pers + (state.pers>1?' pers.':' pers.');
    $('pval').className = 'pv' + (state.pers!==r.portions?' changed':'');
    var h='';
    for (var i=0;i<r.ingredients.length;i++) h += '<li>'+ingText(r.ingredients[i],k)+'</li>';
    $('ring').innerHTML = h;
    h='';
    for (var j=0;j<r.etapes.length;j++) h += '<li>'+esc(r.etapes[j])+'</li>';
    $('rsteps').innerHTML = h;
    fit();
  }
  /* Ajuste la taille du texte pour que la recette tienne sur un seul écran. */
  function fit(){
    var box = $('rbox'); if ($('recipe').className.indexOf('hidden')>=0) return;
    var W = window.innerWidth, H = window.innerHeight;
    var cuisine = document.body.className.indexOf('cuisine')>=0;
    var size = Math.min(W/(cuisine?34:40), H/(cuisine?17:20));
    size = Math.max(12, Math.min(size, 44));
    box.style.fontSize = size+'px';
    var cols = box.querySelectorAll('.rcol'), guard = 0;
    function over(){
      if (box.scrollHeight > box.clientHeight + 1) return true;
      for (var i=0;i<cols.length;i++) if (cols[i].scrollHeight > cols[i].clientHeight + 1) return true;
      return false;
    }
    while (over() && size > 11 && guard < 80){ size -= 0.5; box.style.fontSize = size+'px'; guard++; }
  }

  /* ---------- Plein écran & écran allumé ---------- */
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFs(){
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (f) { try { var p = f.call(el); if (p && p['catch']) p['catch'](function(){}); } catch(e){} }
    else toast('Plein écran non disponible : ajoutez le site à l’écran d’accueil');
  }
  function exitFs(){
    var f = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (f && isFs()) { try { var p=f.call(document); if (p && p['catch']) p['catch'](function(){}); } catch(e){} }
  }
  function toggleFs(){ isFs() ? exitFs() : enterFs(); }
  function lockScreen(){
    if (navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; toast('Mode cuisine : l’écran reste allumé'); })
        ['catch'](function(){ toast('Mode cuisine activé (veille non bloquée)'); });
    } else toast('Mode cuisine activé (ce navigateur ne peut pas bloquer la veille)');
  }
  function unlockScreen(){ if (wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; } }
  function setCuisine(on){
    var b = document.body;
    if (on){ if (b.className.indexOf('cuisine')<0) b.className += ' cuisine'; $('btnCuisine').textContent='× Quitter le mode cuisine'; enterFs(); lockScreen(); }
    else { b.className = b.className.replace(/\s*cuisine/g,''); $('btnCuisine').textContent='Mode cuisine'; unlockScreen(); }
    setTimeout(fit, 350);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState==='visible' && document.body.className.indexOf('cuisine')>=0 && !wakeLock) lockScreen();
  });

  /* ---------- Navigation (#/id) ---------- */
  function route(){
    var m = location.hash.match(/^#\/(.+)$/);
    var r = m ? byId(decodeURIComponent(m[1])) : null;
    if (r){
      state.cur = r; state.pers = r.portions;
      $('home').className='hidden'; $('recipe').className='';
      renderRecipe();
    } else {
      if (document.body.className.indexOf('cuisine')>=0) setCuisine(false);
      state.cur = null; $('recipe').className='hidden'; $('home').className='';
    }
  }

  /* ---------- Événements ---------- */
  $('chips').onclick = function(e){
    var t = e.target; while (t && t!==this && !(t.hasAttribute && t.hasAttribute('data-c'))) t=t.parentNode;
    if (!t || t===this) return;
    state.cat = t.getAttribute('data-c') || null; renderChips(); renderGrid();
  };
  $('grid').onclick = function(e){
    var t = e.target; while (t && t!==this && !t.getAttribute('data-id')) t=t.parentNode;
    if (t && t!==this) location.hash = '#/'+t.getAttribute('data-id');
  };
  $('q').oninput = function(){ state.q = this.value; $('qclear').className = 'clear'+(this.value?'':' hidden'); renderGrid(); };
  $('qclear').onclick = function(){ $('q').value=''; state.q=''; this.className='clear hidden'; renderGrid(); };
  $('btnRandom').onclick = function(){ var r = R[Math.floor(Math.random()*R.length)]; if (r) location.hash='#/'+r.id; };
  $('btnFsHome').onclick = toggleFs;
  $('btnFs').onclick = toggleFs;
  $('btnBack').onclick = function(){ location.hash = ''; };
  $('btnCuisine').onclick = function(){ setCuisine(document.body.className.indexOf('cuisine')<0); };
  $('pminus').onclick = function(){ if (state.pers>1){ state.pers--; renderRecipe(); } };
  $('pplus').onclick = function(){ if (state.pers<12){ state.pers++; renderRecipe(); } };
  function toggleOk(e){ var t=e.target; while (t && t.tagName!=='LI' && t!==this) t=t.parentNode; if (t && t.tagName==='LI') t.className = t.className==='ok' ? '' : 'ok'; }
  $('ring').onclick = toggleOk; $('rsteps').onclick = toggleOk;
  window.onhashchange = route;
  window.onresize = function(){ clearTimeout(fit._t); fit._t = setTimeout(fit, 150); };

  renderChips(); renderGrid(); route();
})();
</script>
</body>
</html>
